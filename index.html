<style>
:root{color-scheme:dark;--bg:#0b0a09;--ink:#f3ece0;--mute:#9a8f7c;--line:#2e2619;--card:#15120d;--green:#e0a93b;--hi:#e0a93b;--red:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font:700 30px/1.1 "Barlow Condensed",system-ui,sans-serif;margin:8px 0 4px;letter-spacing:.2px}
h2{font:600 19px "Barlow Condensed",system-ui,sans-serif;margin:24px 0 8px;color:var(--green);text-transform:uppercase;letter-spacing:.12em}
p.sub{color:var(--mute);margin:0 0 16px}
input,button{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 10px}
input:focus,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
button{border:0;border-radius:10px;padding:13px 16px;font-weight:600;background:var(--green);color:#1a1206;cursor:pointer}
button.alt{background:transparent;color:var(--green);border:1.5px solid var(--line)}
button.del{background:transparent;color:var(--red);padding:8px 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row.on{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 18%,var(--card))}
.row label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:500}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--green)}
.det{margin:-2px 0 10px;padding:0 4px}
.qty{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qty button{width:44px;padding:8px}
.qty b{min-width:28px;text-align:center;font-size:20px}
.logo{width:84px;height:84px;border-radius:20px;display:block;margin:8px 0 12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1.5px solid var(--line)}
.bar button{width:100%;max-width:528px;display:block;margin:0 auto;padding:16px;font-size:18px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;z-index:9}
.link{background:none;color:var(--mute);text-decoration:underline;padding:8px 0;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>

<body>
<main id="app"></main>
<script>
const SB_URL = "https://uapnfbgdodtyxnutpcee.supabase.co";
const SB_KEY = "sb_publishable__IwM31er7DzPxsGJofDs9g_hZgxUvdc";
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById("app");
const LOGO = document.querySelector("link[rel=apple-touch-icon]").href;

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let tt;
function toast(msg) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(tt); tt = setTimeout(() => t.remove(), 3500);
}
function show(...nodes) { app.replaceChildren(...nodes); }

/* ---------- Employés ---------- */
let code = store.get("code"), nom = store.get("nom"), items = [];

function vueLogin() {
  const n = h("input", { type: "text", placeholder: "Ton prénom", value: nom, autocomplete: "given-name" });
  const c = h("input", { type: "text", placeholder: "Code de l'équipe", value: code, autocapitalize: "off" });
  const go = async () => {
    if (!n.value.trim() || !c.value.trim()) return toast("Entre ton prénom et le code.");
    code = c.value.trim(); nom = n.value.trim();
    try { await charger(); store.set("code", code); store.set("nom", nom); vueListe(); }
    catch (e) { toast("Code incorrect. Demande-le au gérant."); }
  };
  show(
    h("img", { class: "logo", src: LOGO, alt: "" }),
    h("h1", {}, "The Place To B"),
    h("p", { class: "sub" }, "Entre ton prénom et le code pour signaler les produits qui manquent."),
    n, c,
    h("button", { onclick: go }, "Entrer"),
    h("div", {}, h("button", { class: "link", onclick: () => { location.hash = "admin"; } }, "Espace gérant"))
  );
}

async function charger() {
  const { data, error } = await sb.rpc("courses_liste", { p_code: code });
  if (error) throw error;
  items = data || [];
}

async function maj(p, besoin, qte, note) {
  const { error } = await sb.rpc("courses_maj", {
    p_code: code, p_id: p.id, p_besoin: besoin, p_qte: qte, p_note: note, p_nom: nom
  });
  if (error) return toast("Erreur : " + error.message);
  Object.assign(p, { besoin, qte: besoin ? qte : 0, note: besoin ? note : "" });
}

function vueListe() {
  const cats = {};
  items.forEach(p => { const k = p.categorie || "Autres"; (cats[k] = cats[k] || []).push(p); });

  const nb = items.filter(p => p.besoin).length;
  const blocs = [h("h1", {}, "Il manque quoi ?"), h("p", { class: "sub" }, "Salut " + nom + ". Coche ce qui est presque fini.")];
  if (!items.length) blocs.push(h("p", { class: "sub" }, "Aucun produit pour l'instant. Le gérant doit d'abord en ajouter."));
  for (const [cat, list] of Object.entries(cats)) {
    blocs.push(h("h2", {}, cat));
    list.forEach(p => {
      const cb = h("input", { type: "checkbox", checked: p.besoin, onchange: async () => {
        await maj(p, cb.checked, 1, ""); vueListe();
      } });
      blocs.push(h("div", { class: "row" + (p.besoin ? " on" : "") }, h("label", {}, cb, p.nom)));
      if (p.besoin) {
        const note = h("input", { type: "text", placeholder: "Précision (facultatif)", value: p.note, maxLength: 120,
          onchange: () => maj(p, true, p.qte, note.value) });
        blocs.push(h("div", { class: "det" },
          h("div", { class: "qty" },
            h("button", { class: "alt", "aria-label": "Moins", onclick: async () => { if (p.qte > 1) { await maj(p, true, p.qte - 1, p.note); vueListe(); } } }, "−"),
            h("b", {}, String(p.qte)),
            h("button", { class: "alt", "aria-label": "Plus", onclick: async () => { if (p.qte < 99) { await maj(p, true, p.qte + 1, p.note); vueListe(); } } }, "+")),
          note));
      }
    });
  }
  blocs.push(h("div", {}, h("button", { class: "link", onclick: () => { store.set("code", ""); code = ""; vueLogin(); } }, "Changer de personne")));
  const send = h("button", { class: "main", onclick: async () => {
    send.disabled = true;
    const { data, error } = await sb.rpc("courses_envoyer", { p_code: code, p_nom: nom });
    send.disabled = false;
    if (error) return toast(error.message.includes("patiente") ? "Patiente 30 secondes avant de renvoyer." : "Erreur : " + error.message);
    toast(data ? data + " produit(s) envoyé(s) au gérant." : "Rien n'est coché.");
  } }, nb ? "Envoyer au gérant (" + nb + ")" : "Envoyer au gérant");
  blocs.push(h("div", { class: "bar" }, send));
  show(...blocs);
}

/* ---------- Gérant ---------- */
async function vueAdmin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return vueAdminLogin();
  const { data, error } = await sb.from("courses_produits").select("*").order("categorie").order("nom");
  if (error) { toast("Accès refusé : ce compte n'est pas gérant."); return vueAdminLogin(); }
  const nomI = h("input", { type: "text", placeholder: "Produit (ex : Beurre)" });
  const catI = h("input", { type: "text", placeholder: "Catégorie (ex : Frais)" });
  const add = h("button", { onclick: async () => {
    if (!nomI.value.trim()) return toast("Écris le nom du produit.");
    const { error } = await sb.from("courses_produits").insert({ nom: nomI.value.trim(), categorie: catI.value.trim() });
    if (error) return toast("Erreur : " + error.message);
    vueAdmin();
  } }, "Ajouter le produit");
  const blocs = [h("h1", {}, "Espace gérant"), h("p", { class: "sub" }, "Gère ta liste de produits."),
    nomI, catI, add];
  const aAcheter = data.filter(p => p.besoin);
  blocs.push(h("h2", {}, "À acheter (" + aAcheter.length + ")"));
  if (!aAcheter.length) blocs.push(h("p", { class: "sub" }, "Rien à acheter pour le moment."));
  aAcheter.forEach(p => blocs.push(h("div", { class: "row on" },
    h("span", { style: "flex:1" }, p.nom + " ×" + p.qte + (p.note ? " (" + p.note + ")" : "") + (p.demande_par ? " — " + p.demande_par : "")),
    h("button", { class: "alt", onclick: async () => {
      await sb.from("courses_produits").update({ besoin: false, qte: 0, note: "", demande_par: "", demande_le: null, achete_le: new Date().toISOString() }).eq("id", p.id);
      vueAdmin();
    } }, "Acheté"))));
  blocs.push(h("h2", {}, "Tous les produits (" + data.length + ")"));
  data.forEach(p => blocs.push(h("div", { class: "row" },
    h("span", { style: "flex:1" }, p.nom, h("small", { style: "color:var(--mute)" }, p.categorie ? "  · " + p.categorie : "")),
    h("button", { class: "del", onclick: async () => {
      if (!confirm("Supprimer " + p.nom + " ?")) return;
      await sb.from("courses_produits").delete().eq("id", p.id); vueAdmin();
    } }, "Supprimer"))));
  blocs.push(h("h2", {}, "Réglages"),
    h("div", { class: "two" },
      h("button", { class: "alt", onclick: async () => {
        const { error } = await sb.rpc("courses_test_notif");
        toast(error ? "Erreur : " + error.message : "Notification de test envoyée.");
      } }, "Tester la notif"),
      h("button", { class: "alt", onclick: async () => { await sb.auth.signOut(); vueAdminLogin(); } }, "Se déconnecter")),
    h("div", {}, h("button", { class: "link", onclick: () => { location.hash = ""; } }, "Retour à la page employés")));
  show(...blocs);
}

function vueAdminLogin() {
  const e = h("input", { type: "email", placeholder: "Ton email", autocomplete: "email" });
  const p = h("input", { type: "password", placeholder: "Mot de passe", autocomplete: "current-password" });
  show(
    h("img", { class: "logo", src: LOGO, alt: "" }),
    h("h1", {}, "Espace gérant"), h("p", { class: "sub" }, "Connecte-toi pour gérer les produits."),
    e, p,
    h("button", { onclick: async () => {
      const { error } = await sb.auth.signInWithPassword({ email: e.value.trim(), password: p.value });
      if (error) return toast("Email ou mot de passe incorrect.");
      vueAdmin();
    } }, "Se connecter"),
    h("div", {}, h("button", { class: "link", onclick: () => { location.hash = ""; } }, "Retour à la page employés"))
  );
}

/* ---------- Démarrage ---------- */
async function route() {
  if (location.hash === "#admin") return vueAdmin();
  if (code) { try { await charger(); return vueListe(); } catch (e) {} }
  vueLogin();
}
window.addEventListener("hashchange", route);
route();
</script>
